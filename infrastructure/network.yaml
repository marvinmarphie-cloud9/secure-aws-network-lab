---
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Secure, compute-free VPC foundation for a future three-tier workload.

Parameters:
  ProjectName:
    Type: String
    Default: secure-network-lab
    Description: Lowercase project identifier used in names and tags.
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
    ConstraintDescription: >-
      Must be 3-31 characters, start with a letter, and contain only lowercase
      letters, numbers, and hyphens.
  Environment:
    Type: String
    Default: lab
    Description: Environment name used in names and tags.
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
    ConstraintDescription: >-
      Must be 2-16 characters, start with a letter, and contain only lowercase
      letters, numbers, and hyphens.
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
    Description: IPv4 CIDR block for the VPC.
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
    ConstraintDescription: Must be a valid IPv4 CIDR notation.

Resources:
  NetworkVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-vpc'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-igw'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref NetworkVpc

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NetworkVpc
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ''
      CidrBlock:
        Fn::Select:
          - 0
          - Fn::Cidr:
              - !Ref VpcCidr
              - 6
              - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-a'
        - Key: Tier
          Value: public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NetworkVpc
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ''
      CidrBlock:
        Fn::Select:
          - 1
          - Fn::Cidr:
              - !Ref VpcCidr
              - 6
              - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-b'
        - Key: Tier
          Value: public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  ApplicationSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NetworkVpc
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ''
      CidrBlock:
        Fn::Select:
          - 2
          - Fn::Cidr:
              - !Ref VpcCidr
              - 6
              - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-app-a'
        - Key: Tier
          Value: application
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  ApplicationSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NetworkVpc
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ''
      CidrBlock:
        Fn::Select:
          - 3
          - Fn::Cidr:
              - !Ref VpcCidr
              - 6
              - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-app-b'
        - Key: Tier
          Value: application
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NetworkVpc
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ''
      CidrBlock:
        Fn::Select:
          - 4
          - Fn::Cidr:
              - !Ref VpcCidr
              - 6
              - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-db-a'
        - Key: Tier
          Value: database
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NetworkVpc
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ''
      CidrBlock:
        Fn::Select:
          - 5
          - Fn::Cidr:
              - !Ref VpcCidr
              - 6
              - 8
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-db-b'
        - Key: Tier
          Value: database
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NetworkVpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-rt'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PublicInternetRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  ApplicationRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NetworkVpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-app-rt'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  DatabaseRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NetworkVpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-db-rt'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  ApplicationSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref ApplicationRouteTable
      SubnetId: !Ref ApplicationSubnetA

  ApplicationSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref ApplicationRouteTable
      SubnetId: !Ref ApplicationSubnetB

  DatabaseSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref DatabaseRouteTable
      SubnetId: !Ref DatabaseSubnetA

  DatabaseSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref DatabaseRouteTable
      SubnetId: !Ref DatabaseSubnetB

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref NetworkVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref ApplicationRouteTable
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-s3-endpoint'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: >-
        Future load balancer tier; HTTPS ingress from the internet.
      VpcId: !Ref NetworkVpc
      SecurityGroupIngress:
        - Description: >-
            Public HTTPS entry point for a future load balancer.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-lb-sg'
        - Key: Tier
          Value: load-balancer
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: >-
        Future application tier; ingress only from the load balancer tier.
      VpcId: !Ref NetworkVpc
      SecurityGroupIngress:
        - Description: >-
            Future application traffic from the load balancer tier.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-app-sg'
        - Key: Tier
          Value: application
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: >-
        Future database tier; PostgreSQL ingress only from the application tier.
      VpcId: !Ref NetworkVpc
      SecurityGroupIngress:
        - Description: >-
            Future PostgreSQL traffic from the application tier.
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-db-sg'
        - Key: Tier
          Value: database
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  FlowLogsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
      LogGroupName: !Sub '/aws/vpc/${ProjectName}/${Environment}/flow-logs'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: >-
        Allows VPC Flow Logs to publish to the dedicated encrypted log group.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PublishVpcFlowLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt FlowLogsLogGroup.Arn
                  - !Sub '${FlowLogsLogGroup.Arn}:*'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-flow-logs-role'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogsLogGroup
      LogFormat: >-
        ${version} ${account-id} ${interface-id} ${srcaddr} ${dstaddr}
        ${srcport} ${dstport} ${protocol} ${packets} ${bytes} ${start}
        ${end} ${action} ${log-status}
      MaxAggregationInterval: 60
      ResourceId: !Ref NetworkVpc
      ResourceType: VPC
      TrafficType: ALL

Outputs:
  VpcId:
    Description: ID of the secure network VPC.
    Value: !Ref NetworkVpc
    Export:
      Name: !Sub '${ProjectName}-${Environment}-vpc-id'
  PublicSubnetAId:
    Description: ID of the public subnet in the first selected AZ.
    Value: !Ref PublicSubnetA
  PublicSubnetBId:
    Description: ID of the public subnet in the second selected AZ.
    Value: !Ref PublicSubnetB
  ApplicationSubnetAId:
    Description: ID of the private application subnet in the first selected AZ.
    Value: !Ref ApplicationSubnetA
  ApplicationSubnetBId:
    Description: ID of the private application subnet in the second selected AZ.
    Value: !Ref ApplicationSubnetB
  DatabaseSubnetAId:
    Description: ID of the isolated database subnet in the first selected AZ.
    Value: !Ref DatabaseSubnetA
  DatabaseSubnetBId:
    Description: ID of the isolated database subnet in the second selected AZ.
    Value: !Ref DatabaseSubnetB
  LoadBalancerSecurityGroupId:
    Description: Future load balancer security group ID.
    Value: !Ref LoadBalancerSecurityGroup
  ApplicationSecurityGroupId:
    Description: Future application security group ID.
    Value: !Ref ApplicationSecurityGroup
  DatabaseSecurityGroupId:
    Description: Future database security group ID.
    Value: !Ref DatabaseSecurityGroup
  FlowLogsLogGroupName:
    Description: Encrypted CloudWatch Logs group receiving VPC Flow Logs.
    Value: !Ref FlowLogsLogGroup
