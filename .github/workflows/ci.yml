---
name: Validate Secure AWS Network Lab

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: |
          python -m pip install --disable-pip-version-check \
            cfn-lint yamllint pyyaml pytest

      - name: Parse YAML files
        run: |
          python -c "import yaml; yaml.safe_load(open(
            '.github/workflows/ci.yml'))"

      - name: Check YAML formatting
        run: |
          yamllint --strict infrastructure/network.yaml \
            .github/workflows/ci.yml

      - name: Lint CloudFormation
        run: |
          cfn-lint infrastructure/network.yaml

      - name: Run architecture tests
        run: python -m pytest -q

      - name: Scan for credentials, account IDs, wildcard IAM, and local paths
        shell: bash
        run: |
          scan_paths=(infrastructure docs scripts tests README.md .gitignore)
          credential_pattern='AKIA[0-9A-Z]{16}|aws_secret_access_key|aws_access_key_id'
          credential_pattern+='|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|'
          credential_pattern+='[0-9]{12}'
          if grep -RInE "$credential_pattern" "${scan_paths[@]}"; then
            echo "Credential or account ID pattern found."
            exit 1
          elif [[ $? -ne 1 ]]; then
            echo "Credential scan could not complete."
            exit 2
          fi

          if grep -RInE "Action: ['\"]?\\*|Resource: ['\"]?\\*" \
            infrastructure; then
            echo "Wildcard IAM action or resource found."
            exit 1
          elif [[ $? -ne 1 ]]; then
            echo "Wildcard IAM scan could not complete."
            exit 2
          fi

          if grep -RInE '([A-Za-z]:\\\\|/Users/|/home/|/root/)' \
            "${scan_paths[@]}"; then
            echo "Local absolute path found."
            exit 1
          elif [[ $? -ne 1 ]]; then
            echo "Local path scan could not complete."
            exit 2
          fi

      - name: Verify clean formatting and diff
        run: git diff --check
